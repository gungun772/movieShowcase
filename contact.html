<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Mingle</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="icon" href="images/fav.ico">
</head>
<body>
    <div class="contact_div">
        <div class="map">
            <iframe class="contact_map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d219985.13239228545!2d76.49830977065896!3d30.51346873495391!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390fec00d166f58b%3A0x8a8c7b6ac3c8b0b1!2sCinepolis!5e0!3m2!1sen!2sin!4v1725277871006!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <form class="contact_start"> 
            <div class="c_head"><h1>Contact us form</h1></div>
            <div class="name">
                <div class="input-group flex-nowrap c_name">
                    <input type="text" class="form-control p-3 mb-2 bg-transparent text-white border border-dark fw-bolder" placeholder="First name" aria-label="Username" aria-describedby="addon-wrapping" id="contact_items">
                </div>
                <div class="input-group flex-nowrap c_name">
                    <input type="text" class="p-3 mb-2 bg-transparent text-white form-control border border-dark fw-bolder" placeholder="Last name" aria-label="Username" aria-describedby="addon-wrapping" id="contact_items">
                </div>
            </div>
            <div class="contact_email">
                <div class="mb-3 c_name">
                    <input type="email" class="p-3 mb-2 bg-transparent text-white form-control border border-dark fw-bolder" id="exampleInputEmail1" placeholder="Email" aria-describedby="emailHelp">
                </div>
                <div class="mb-3 c_name">
                    <input type="number" class="p-3 mb-2 bg-transparent text-white form-control border border-dark fw-bolder" id="exampleInputMobile" placeholder="Mobile">
                </div>
            </div>
            <div class="area c_name1">
                <textarea name="area" id="textarea" class="p-3 mb-2 bg-transparent text-white form-control text_area border border-dark fw-bolder" placeholder="Type your message here...."></textarea>
            </div>
            <div class="contact_send">
                <button type="submit" class="button mb-2 bg-white text-dark fw-bolder">Submit</button>
            </div>
        </form> 
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector("form.contact_start"); 

            form.addEventListener("submit", async (event) => {
                event.preventDefault();
                console.log("Form submitted"); 

                const formData = {
                    firstName: document.querySelector("input[placeholder='First name']").value,
                    lastName: document.querySelector("input[placeholder='Last name']").value,
                    email: document.querySelector("input[placeholder='Email']").value,
                    mobile: document.querySelector("input[placeholder='Mobile']").value,
                    message: document.querySelector("#textarea").value,
                };

                console.log("Form data:", formData); 

                try {
                    const response = await fetch("http://localhost:3000/contactsubmit", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(formData),
                    });

                    const result = await response.json();
                    console.log("Response from server:", result); 
                    alert(result.message); 
                    if (result.success) form.reset();
                } catch (error) {
                    console.error("Error submitting form:", error); 
                    alert("An error occurred while submitting the form.");
                }
            });
        });
    </script>
</body>
</html>
