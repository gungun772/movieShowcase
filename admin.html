<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Users</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 8px;
    }
  
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #ff0033; /* Cherry red */
      margin-bottom: 30px;
      font-size: 2rem;
      animation: fadeIn 1s ease-in-out;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.2);
      animation: fadeInUp 1s ease forwards;
    }

    th, td {
      padding: 16px;
      text-align: left;
    }

    thead {
      background-color: #ff0033;
      color: #fff;
    }

    tbody tr {
      border-bottom: 1px solid #333;
      transition: background-color 0.3s ease;
      animation: slideIn 0.4s ease;
    }

    tbody tr:hover {
      background-color: #2a2a2a;
    }

    button {
      background-color: #ff0033;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #cc0029;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { transform: translateX(-30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
  </style>
</head>
<body>
  <h1>Admin Dashboard - Users</h1>
  <table id="userTable">
    <thead>
      <tr>
        <th>Email</th>
        <th>Mobile</th>
        <th>Password</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- User rows will go here -->
    </tbody>
  </table>

  <script>
    function loadUsers() {
      const emails = JSON.parse(localStorage.getItem("email") || "[]");
      const mobiles = JSON.parse(localStorage.getItem("mobile") || "[]");
      const passwords = JSON.parse(localStorage.getItem("password") || "[]");

      const users = emails.map((email, index) => ({
        email,
        mobile: mobiles[index] || "",
        password: passwords[index] || ""
      }));

      displayUsers(users);
    }

    function displayUsers(users) {
      const tbody = document.querySelector("#userTable tbody");
      tbody.innerHTML = "";

      users.forEach((user, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${user.email}</td>
          <td>${user.mobile}</td>
          <td>${user.password}</td>
          <td><button onclick="deleteUser(${index})">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteUser(index) {
      if (confirm("Are you sure you want to delete this user?")) {
        let emails = JSON.parse(localStorage.getItem("email") || "[]");
        let mobiles = JSON.parse(localStorage.getItem("mobile") || "[]");
        let passwords = JSON.parse(localStorage.getItem("password") || "[]");

        emails.splice(index, 1);
        mobiles.splice(index, 1);
        passwords.splice(index, 1);

        localStorage.setItem("email", JSON.stringify(emails));
        localStorage.setItem("mobile", JSON.stringify(mobiles));
        localStorage.setItem("password", JSON.stringify(passwords));

        loadUsers(); // reload table
      }
    }

    loadUsers();
  </script>
</body>
</html>
