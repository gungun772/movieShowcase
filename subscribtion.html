<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Plan - Cinema Sequel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="subscription-section">
        <h2>Choose Your Plan</h2>
        <div class="plan-grid">
            <div class="plan-card">
                <h3>Basic</h3>
                <p class="price">$9.99/month</p>
                <ul>
                    <li>SD Quality</li>
                    <li>1 Device</li>
                    <li>Limited Movies</li>
                </ul>
                <button class="select-plan">Select Plan</button>
            </div>
            <div class="plan-card">
                <h3>Standard</h3>
                <p class="price">$14.99/month</p>
                <ul>
                    <li>HD Quality</li>
                    <li>2 Devices</li>
                    <li>Unlimited Movies</li>
                </ul>
                <button class="select-plan">Select Plan</button>
            </div>
            <div class="plan-card">
                <h3>Premium</h3>
                <p class="price">$19.99/month</p>
                <ul>
                    <li>4K Quality</li>
                    <li>4 Devices</li>
                    <li>Unlimited Movies</li>
                </ul>
                <button class="select-plan">Select Plan</button>
            </div>
        </div>
    </div>

    <script>
        // Handle plan selection
        document.querySelectorAll('.select-plan').forEach(button => {
            button.addEventListener('click', function () {
                alert('Thank you for choosing a plan!');
            });
        });
    </script>
</body>
</html>
